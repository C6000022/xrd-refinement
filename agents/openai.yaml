interface:
  display_name: "XRD 精修"
  short_description: "精修HighScore Plus前确认参数与文件来源，原路径存Refined，附件先问保存目录"
  default_prompt: "使用 $xrd-refinement 精修我提供的 HighScore Plus 工程；先确认背景、定量目标和质量基准、内标、计算设置及 CIF 完整性；原始路径明确时保存到其 Refined，只有附件副本或来源不明时先问最终保存目录，再自主精修，并在聊天提供完整结果路径的可点击链接。"
policy:
  allow_implicit_invocation: true
